services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-db:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/financecontrol.db
      CORS_ORIGINS: '["http://localhost:5173"]'
      BRAPI_API_TOKEN: ${BRAPI_API_TOKEN:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  backend-db: